<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central do Escrivão — Polícia Federal</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logo.png">
  <link rel="shortcut icon" type="image/png" href="assets/logo.png">
  <meta name="theme-color" content="#0a1829">
  
  <link rel="stylesheet" href="../cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/account-access.css">
  <script src="js/offline-paths.js"></script>
</head>
<body>
  <!-- Cabeçalho Institucional Oficial -->
  <div id="site-header-placeholder"></div>

  <!-- Estrutura Principal da Tela de Login -->
  <main class="escrivao-login-wrapper">
    <div class="escrivao-login-card">
      <div class="escrivao-card-header">
        <img src="assets/logo.png" alt="Brasão Oficial da Polícia Federal" class="escrivao-logo">
        <div class="escrivao-dept-tag">
          <i class="fa-solid fa-shield-halved"></i> Polícia Federal
        </div>
        <h1 class="escrivao-title">CENTRAL DO ESCRIVÃO</h1>
        <div class="escrivao-subtitle">Sistema interno</div>
      </div>

      <div class="escrivao-card-body">
        <!-- Container Dinâmico para Mensagens de Erro ou Alertas -->
        <div id="login-alerts" role="alert" style="display: none;"></div>

        <!-- OPÇÃO 1: PRINCIPAL — ENTRAR COM DISCORD -->
        <a href="/auth/discord" id="btn-discord-login" class="btn-discord-escrivao" title="Entrar com sua conta Discord autorizada">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.3 4.4a20 20 0 0 0-5-1.5l-.6 1.2a18.6 18.6 0 0 0-5.4 0l-.6-1.2a20 20 0 0 0-5 1.5C.5 9.2-.3 13.9.1 18.5a20.2 20.2 0 0 0 6.1 3.1l1.3-2.1-1.9-.9.5-.4c3.8 1.8 8 1.8 11.8 0l.5.4-1.9.9 1.3 2.1a20.2 20.2 0 0 0 6.1-3.1c.5-5.3-.8-10-3.6-14.1ZM8 15.7c-1.2 0-2.1-1.1-2.1-2.5s.9-2.5 2.1-2.5 2.1 1.1 2.1 2.5-.9 2.5-2.1 2.5Zm8 0c-1.2 0-2.1-1.1-2.1-2.5s.9-2.5 2.1-2.5 2.1 1.1 2.1 2.5-.9 2.5-2.1 2.5Z"></path>
          </svg>
          Entrar com Discord
        </a>

        <!-- OPÇÃO 2: SECUNDÁRIA — BAIXAR APLICATIVO DESKTOP (.EXE) -->
        <button type="button" id="btn-desktop-app" class="btn-desktop-escrivao" onclick="mostrarAvisoDesktop()" title="Baixar aplicativo desktop oficial para Windows (.exe)">
          <i class="fa-brands fa-windows"></i>
          Baixar Aplicativo Desktop (.EXE)
        </button>

        <!-- Rodapé do Card com Informativo de Segurança -->
        <div class="escrivao-card-footer">
          <div class="escrivao-security-notice">
            <i class="fa-solid fa-lock"></i>
            <span>Acesso restrito exclusivamente aos escrivães da Polícia Federal</span>
          </div>
        </div>

        <!-- Box Auxiliar para Desenvolvimento / Testes Locais -->
        <div id="dev-mode-hint" class="escrivao-dev-box" style="display: none;"></div>
      </div>
    </div>
  </main>

  <!-- Rodapé Institucional Oficial -->
  <div id="site-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="js/header.js"></script>

  <script>
    // Gerenciamento de Alertas e Notificações da Autenticação
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const error = urlParams.get('error');
      const logout = urlParams.get('logout');
      const alertsContainer = document.getElementById('login-alerts');

      if (!alertsContainer) return;

      if (error) {
        alertsContainer.style.display = 'block';

        if (error === 'not_in_guild') {
          alertsContainer.className = 'escrivao-alert escrivao-alert-danger';
          alertsContainer.innerHTML = `
            <i class="fa-solid fa-circle-xmark"></i>
            <div>
              <strong>Acesso Negado</strong><br>
              Seu usuário do Discord não pertence ao servidor autorizado.
            </div>
          `;
        } else if (error === 'missing_role') {
          alertsContainer.className = 'escrivao-alert escrivao-alert-danger';
          alertsContainer.innerHTML = `
            <i class="fa-solid fa-user-xmark"></i>
            <div>
              <strong>Acesso Negado</strong><br>
              Você não possui o cargo necessário para acessar a Central do Escrivão.
            </div>
          `;
        } else if (error === 'unauthorized') {
          alertsContainer.className = 'escrivao-alert escrivao-alert-warning';
          alertsContainer.innerHTML = `
            <i class="fa-solid fa-shield-halved"></i>
            <div>
              <strong>Área Restrita</strong><br>
              É necessário autenticar-se para acessar os recursos da Central do Escrivão.
            </div>
          `;
        } else if (error === 'auth_failed') {
          alertsContainer.className = 'escrivao-alert escrivao-alert-danger';
          alertsContainer.innerHTML = `
            <i class="fa-solid fa-triangle-exclamation"></i>
            <div>
              <strong>Falha na Autenticação</strong><br>
              Não foi possível concluir o login pelo Discord. Tente novamente.
            </div>
          `;
        } else if (error === 'missing_config') {
          alertsContainer.className = 'escrivao-alert escrivao-alert-warning';
          alertsContainer.innerHTML = `
            <i class="fa-solid fa-gear"></i>
            <div>
              <strong>Configuração Necessária</strong><br>
              Credenciais do Discord (Client ID / Secret) pendentes no arquivo <code>.env</code>.
            </div>
          `;
        }

        // Limpar parâmetros da URL para manter a barra limpa
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', window.location.pathname);
        }
      } else if (logout === 'true') {
        alertsContainer.style.display = 'block';
        alertsContainer.className = 'escrivao-alert escrivao-alert-info';
        alertsContainer.innerHTML = `
          <i class="fa-solid fa-circle-check"></i>
          <div>Sessão encerrada com sucesso.</div>
        `;
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', window.location.pathname);
        }
      }

      // Consulta de status da API para orientar no ambiente local de testes
      fetch('/api/auth/config-status')
        .then(res => res.json())
        .then(data => {
          const devHint = document.getElementById('dev-mode-hint');
          if (!data.configured && devHint) {
            devHint.style.display = 'block';
            devHint.innerHTML = `
              <div style="font-weight:700;margin-bottom:4px;color:#d4a359;">
                <i class="fa-solid fa-laptop-code"></i> Modo de Demonstração / Testes
              </div>
              <div>Configure o <code>.env</code> para conectar ao Discord oficial.</div>
              <div style="margin-top:6px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
                <a href="/auth/dev-login" style="color:#38bdf8;">[ Simular Acesso Escrivão ]</a>
                <a href="/auth/dev-login?mode=not_in_guild" style="color:#fca5a5;">[ Testar Sem Servidor ]</a>
                <a href="/auth/dev-login?mode=missing_role" style="color:#fca5a5;">[ Testar Sem Cargo ]</a>
              </div>
            `;
          }
        })
        .catch(() => {});
    })();

    // Ação do Botão Secundário do Aplicativo Desktop
    function mostrarAvisoDesktop() {
      if (typeof window.mostrarAvisoIndisponivel === 'function') {
        window.mostrarAvisoIndisponivel('O aplicativo Desktop (.EXE) da Central do Escrivão encontra-se em desenvolvimento e estará disponível para download em breve.');
      } else {
        alert('O aplicativo Desktop (.EXE) da Central do Escrivão encontra-se em desenvolvimento.');
      }
    }
  </script>
</body>
</html>
